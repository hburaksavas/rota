<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f6f5">
    <title>Rota · PO çalışma alanı</title>
    <link rel="stylesheet" href="./src/styles.css">
    <link rel="stylesheet" href="./src/po-tools.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-tools"><button class="sidebar-toggle" data-action="toggle-sidebar" aria-label="Yan menüyü daralt" title="Yan menüyü daralt"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M9 4.5v15"/></svg></button></div>
        <button class="workspace-switcher active" data-view="overview" title="Genel bakış" aria-label="Genel bakışı aç">
          <span class="workspace-avatar">K</span>
          <span class="workspace-label"><strong>Kuzey Finans</strong><small>PO çalışma alanı</small></span>
          <svg class="workspace-overview-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><rect x="14" y="14" width="6" height="6" rx="1.2"/></svg>
        </button>
        <div class="sidebar-scroll">
        <nav class="primary-nav">
          <details class="nav-group" data-nav-group="product" open>
            <summary><span>Proje Takip</span><i aria-hidden="true"></i></summary>
            <div class="nav-group-items">
              <button class="nav-item" data-view="backlog"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg></span>Backlog <span class="nav-count" id="nav-backlog-count">12</span></button>
              <button class="nav-item" data-view="favspace"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></span>Favspace</button>
              <button class="nav-item jira-nav-item" data-view="jira"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 21 12l-9 9-9-9z"/><path d="m12 8.5 3.5 3.5-3.5 3.5L8.5 12z"/></svg></span>Jira <span class="jira-nav-state" id="jira-nav-state">Kapalı</span></button>
              <button class="nav-item" data-view="assets"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg></span>Ürün envanteri <span class="nav-count" id="nav-assets-count">0</span></button>
              <button class="nav-item" data-view="roadmap"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span>Yol haritası</button>
              <button class="nav-item" data-view="decisions"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span>Ürün kararları</button>
              <button class="nav-item" data-view="releases"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4"/><path d="M5 4h12l-2.5 4.5L17 13H5"/></svg></span>Release planı</button>
              <div class="nav-label project-label">PROJELER <button class="tiny-plus" data-tooltip="Yeni proje oluştur" aria-label="Yeni proje oluştur"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
              <div class="project-list">
                <button class="project-item selected"><span class="project-dot dot-blue"></span>Ödeme Platformu</button>
                <button class="project-item"><span class="project-dot dot-violet"></span>Dijital Kanallar</button>
                <button class="project-item"><span class="project-dot dot-amber"></span>Kredi Yaşam Döngüsü</button>
              </div>
            </div>
          </details>

        </nav>
        </div>
        <div class="sidebar-bottom">
          <div class="storage-card">
            <div class="storage-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="12" width="18" height="8" rx="2"/><path d="M5 12 7.5 5h9L19 12M7 16h.01M11 16h.01"/></svg></div>
            <div><strong>Yerel çalışma alanı</strong><small>Dosyalar bu cihazda kalır</small></div>
            <span class="status-dot"></span>
          </div>
          <button class="profile" title="Ayarlar">
            <span class="profile-avatar">DA</span>
            <span><strong>Deniz Arslan</strong><small>Product Owner</small></span>
            <span class="more">···</span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>Kuzey Finans</span><span class="crumb-separator">/</span><strong id="breadcrumb-current">Genel bakış</strong></div>
          <div class="topbar-actions">
            <label class="global-search"><span class="search-glyph"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></span><input id="global-search" type="search" placeholder="Tüm kayıtlarda ara veya komut yaz…" aria-label="Kayıt ve komut ara" aria-controls="global-search-results" aria-expanded="false" autocomplete="off"><kbd>Ctrl K</kbd></label><div id="global-search-results" class="global-search-results" role="listbox" hidden></div>
            <button class="icon-button archive-search-button" data-view="archive-search" data-tooltip="Arşivde ara" aria-label="Arşivde ara"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5h12.5a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-12a2 2 0 0 1-2-2v-7a2 2 0 0 1 1.5-1.94"/><path d="M2.5 8.5V5.75A1.75 1.75 0 0 1 4.25 4h8.5L16 7.25"/><circle cx="17" cy="15.5" r="3.25"/><path d="m19.4 17.9 2.1 2.1"/></svg></button>
            <div class="topbar-divider"></div>
            <button type="button" class="theme-toggle" data-action="toggle-theme" data-tooltip="Koyu temaya geç" aria-label="Koyu temaya geç"><svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg></button>
            <button type="button" class="zoom-indicator" id="zoom-indicator" data-action="reset-zoom" title="Yakınlaştırma %100 · Ctrl + tekerlek ile değiştir · Sıfırlamak için tıkla" aria-label="Yakınlaştırma %100. Varsayılan boyuta döndürmek için tıkla."><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.25"/><path d="m15.3 15.3 4.7 4.7"/><path d="M7.6 10.5h5.8M10.5 7.6v5.8"/></svg><span id="zoom-level">100%</span></button>
            <button class="help-button" data-tooltip="Klavye kısayollarını göster" aria-label="Klavye kısayollarını göster"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.8 9a2.4 2.4 0 1 1 3.4 2.2c-.8.4-1.2.9-1.2 1.8M12 17h.01"/></svg></button>
          </div>
        </header>
        <div class="workspace-commandbar">
          <button type="button" class="workspace-command-context" data-view="overview" aria-label="Çalışma alanını aç" data-tooltip="Çalışma alanını aç"><span class="workspace-context-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/></svg></span><span>Çalışma alanı<small id="workspace-command-scope">Tüm projeler</small></span></button>
          <div class="workspace-tools" role="toolbar" aria-label="Çalışma alanı araçları">
            <span class="workspace-tool-highlight" aria-hidden="true"></span>
            <button type="button" class="workspace-tool workspace-tool-create" data-workspace-create="item" data-tooltip="Yeni backlog işi" aria-label="Yeni backlog işi"><span class="workspace-tool-icon" data-workspace-icon="add"></span><span>İş</span></button>
            <button type="button" class="workspace-tool" data-workspace-create="task" data-tooltip="Yeni görev" aria-label="Yeni görev"><span class="workspace-tool-icon" data-workspace-icon="task"></span><span>Görev</span></button>
            <button type="button" class="workspace-tool" data-workspace-create="note" data-tooltip="Yeni not" aria-label="Yeni not"><span class="workspace-tool-icon" data-workspace-icon="note"></span><span>Not</span></button>
            <button type="button" class="workspace-tool" data-po="meetings" aria-label="Toplantı modu" data-tooltip="Toplantı modu"><span class="workspace-tool-icon" data-workspace-icon="calendar"></span><span>Toplantı</span></button>
            <button type="button" class="workspace-tool" data-po="mine" aria-label="Bana düşenler" data-tooltip="Bana düşenler"><span class="workspace-tool-icon" data-workspace-icon="help"></span><span>Bana düşenler</span><small data-po-mine-count>0</small></button>
            <span class="workspace-tool-divider" aria-hidden="true"></span>
            <button type="button" class="workspace-tool" data-workspace-panel="tasks" aria-label="Çalışma alanı görevleri" aria-controls="workspace-shelf" aria-expanded="false"><span class="workspace-tool-icon" data-workspace-icon="list"></span><span>Görevler</span><small data-workspace-count="tasks">0</small></button>
            <button type="button" class="workspace-tool" data-workspace-panel="notes" aria-label="Çalışma alanı notları" aria-controls="workspace-shelf" aria-expanded="false"><span class="workspace-tool-icon" data-workspace-icon="notes"></span><span>Notlar</span><small data-workspace-count="notes">0</small></button>
            <button type="button" class="workspace-tool" data-workspace-panel="questions" aria-label="Çalışma alanı açık soruları" aria-controls="workspace-shelf" aria-expanded="false"><span class="workspace-tool-icon" data-workspace-icon="help"></span><span>Sorular</span><small data-workspace-count="questions">0</small></button>
          </div>
          <section id="workspace-shelf" class="workspace-shelf" role="region" aria-labelledby="workspace-shelf-title" hidden>
            <header class="workspace-shelf-header"><div><span class="workspace-shelf-kicker">ÇALIŞMA ALANI</span><h2 id="workspace-shelf-title">Görevler</h2></div><button type="button" class="workspace-shelf-add" data-workspace-create="task" aria-label="Yeni görev">＋</button><button type="button" class="workspace-shelf-close" data-workspace-close aria-label="Kayıt panelini kapat">×</button></header>
            <div class="workspace-shelf-filters"><label class="workspace-shelf-search"><span data-workspace-icon="search" aria-hidden="true"></span><input id="workspace-shelf-search" type="search" placeholder="Kayıtlarda ara…" aria-label="Çalışma alanı kayıtlarında ara"></label><label class="workspace-show-completed"><input id="workspace-show-completed" type="checkbox"> Tamamlananlar</label></div>
            <label class="workspace-question-filter" hidden>Durum<select id="workspace-question-filter" class="field-input" aria-label="Soruları filtrele"><option value="open">Açık</option><option value="all">Tümü</option><option value="answered">Yanıtlandı</option></select></label>
            <div id="workspace-shelf-list" class="workspace-shelf-list"></div>
            <footer class="workspace-shelf-footer"><span id="workspace-shelf-count"></span><kbd>Esc</kbd></footer>
          </section>
        </div>
        <div id="view-root"></div>
      </main>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>
    <script defer src="./dist/renderer/app.js"></script>
  </body>
</html>
